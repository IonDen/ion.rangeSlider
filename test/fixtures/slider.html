<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ion.rangeSlider fixture</title>
<style>body { margin: 40px; } #wrap { width: 600px; }</style>
</head>
<body>
<div id="wrap"><input type="text" id="slider" name="slider"></div>
<script>
(function () {
    var q = {};
    var parts = location.search.slice(1).split('&');
    for (var i = 0; i < parts.length; i++) {
        if (!parts[i]) continue;
        var kv = parts[i].split('=');
        q[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
    }
    var jq = q.jquery || 'jquery-3.7.1';
    var jqSrc = jq.indexOf('vendor/') === 0
        ? '/test/' + jq
        : '/node_modules/' + jq + '/dist/' + (q.slim === '1' ? 'jquery.slim.js' : 'jquery.js');
    var min = q.min === '1';
    window.__irs = { ready: false, events: [], q: q, jquerySrc: jqSrc, min: min };
    document.write('<link rel="stylesheet" href="/css/ion.rangeSlider' + (min ? '.min' : '') + '.css">');
    document.write('<script src="' + jqSrc + '"><\/script>');
    document.write('<script src="/js/ion.rangeSlider' + (min ? '.min' : '') + '.js"><\/script>');
    window.onload = function () {
        var config = q.config ? eval('(' + q.config + ')') : {};   // eval: IE8 has no JSON.parse
        var names = ['onStart', 'onChange', 'onFinish', 'onUpdate'];
        for (var n = 0; n < names.length; n++) {
            (function (name) {
                // #359: chain through to a test-supplied handler for this
                // name, if the config already set one, before recording --
                // additive only. Every test before #359 leaves these four
                // unset in its config, so `original` is always null there
                // and this is byte-identical to before. Lets a test attach a
                // real onStart body (e.g. a DOM edit, to contrast against
                // onInit) while this recorder still captures the event.
                var original = typeof config[name] === 'function' ? config[name] : null;
                config[name] = function (data) {
                    if (original) {
                        original.call(this, data);
                    }
                    window.__irs.events.push({
                        type: name, from: data.from, to: data.to, min: data.min, max: data.max,
                        from_percent: data.from_percent, to_percent: data.to_percent,
                        from_value: data.from_value, to_value: data.to_value,
                        from_min: data.from_min, from_max: data.from_max,
                        to_min: data.to_min, to_max: data.to_max,
                        // #661: carries the prettified from/to text -- in values
                        // mode this must be the prettified VALUE (matching the
                        // rendered bubble), not the prettified index.
                        from_pretty: data.from_pretty, to_pretty: data.to_pretty,
                        // #639: appended, additive only -- existing assertions
                        // elsewhere compare event `type` sequences or specific
                        // fields via toMatchObject(), never the whole object.
                        min_pretty: data.min_pretty, max_pretty: data.max_pretty
                    });
                };
            })(names[n]);
        }
        if (q.hidden === '1') {
            // #831 hidden-at-init coverage: the diapason clamp lives in
            // validate(), which runs before any layout, so it must produce
            // the correct clamped value even when the container has zero
            // width/height at init time.
            document.getElementById('wrap').style.display = 'none';
        }
        if (q.width) {
            // #577 narrow-width coverage: lets a test render the slider
            // narrower than this fixture's default 600px. Needed because
            // the pre-#742 focus handler read the handle's on-screen
            // position through the pixel<->value conversion, and that
            // introduced a small positional bias which grows as the
            // slider narrows -- a fine-step value only crosses into the
            // next step once the slider is narrow enough (see the #577
            // test in smoke.spec.mjs for the measured widths).
            document.getElementById('wrap').style.width = parseInt(q.width, 10) + 'px';
        }
        if (q.attrs) {
            // #535 data-* route coverage: apply attributes to the input
            // before init, the same server-markup channel config_from_data
            // reads (e.g. data-prettify), separate from passing the same
            // option through the JS config object above.
            var attrs = eval('(' + q.attrs + ')'); // eval: IE8 has no JSON.parse
            var el = document.getElementById('slider');
            for (var an in attrs) {
                if (attrs.hasOwnProperty(an)) {
                    el.setAttribute(an, attrs[an]);
                }
            }
        }
        if (q.wrap === 'flex' || q.wrap === 'inline-flex') {
            // #776: flex/inline-flex parent coverage. `.irs` declares no
            // width; as a block it fills #wrap, but as a flex item
            // with `flex-basis: auto` it falls back to content-based sizing,
            // and every meaningful descendant is position:absolute (0
            // intrinsic content size), so the slider collapsed to 0 width.
            document.getElementById('wrap').style.display = q.wrap;
        }
        jQuery('#slider').ionRangeSlider(config);
        window.__irs.slider = jQuery.data(document.getElementById('slider'), 'ionRangeSlider');
        window.__irs.jqueryVersion = jQuery.fn.jquery;
        window.__irs.ready = true;
    };
})();
</script>
</body>
</html>
