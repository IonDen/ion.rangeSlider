name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # The browser jobs run inside Playwright's own Docker image for the exact @playwright/test
  # version in package-lock.json (issue #944). The image carries the three browsers built for
  # that release with every system library they need, so the suite does not depend on what
  # GitHub installs on ubuntu-latest, and a Playwright upgrade moves the image with it. The
  # -noble (Ubuntu 24.04) suffix is deliberate: changing the distribution is an edit here,
  # never a side effect of an upgrade. No browser cache: one saved on the 24.04 runners and
  # restored on 26.04 left WebKit unable to start (2026-10-26). The container runs as uid 1001,
  # the runner's own user, as in Playwright's CI guide: the workspace and home folders the
  # runner mounts belong to that user, and the browsers do not run as root.
  playwright-image:
    name: playwright image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: lock
        run: node scripts/playwright-version.mjs >> "$GITHUB_OUTPUT"

  browser:
    name: browser (${{ matrix.id }})
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-image.outputs.version }}-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two cells carry the generated combination matrix (--project=matrix, 128
          # configurations, about four and a half minutes on the CI runner):
          # 3.7.1 and 1.8.3, one build on each side of the jQuery 3.3 change in how a
          # hidden container is measured. From 3.3 a slider built inside a display:none
          # container measures its track as zero and has nothing to render on until it is
          # shown; before 3.3 it measures 100 px and renders at init, so the matrix's
          # hidden-container configurations report different things on the two sides. The
          # other two cells stay --project=chromium only.
          - { id: '3.7.1', jquery: 'jquery-3.7.1', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '3.7.1-min', jquery: 'jquery-3.7.1', slim: '0', projects: '--project=chromium', min: '1' }
          - { id: '1.8.3', jquery: 'vendor/jquery-1.8.3.js', slim: '0', projects: '--project=chromium --project=matrix' }
          - { id: '4.0.0-slim', jquery: 'jquery-4.0.0', slim: '1', projects: '--project=chromium' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test ${{ matrix.projects }}
        env:
          IRS_JQUERY: ${{ matrix.jquery }}
          IRS_SLIM: ${{ matrix.slim }}
          IRS_MIN: ${{ matrix.min || '0' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ matrix.id }}
          path: playwright-report

  built-files:
    name: built files
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-dist.mjs --base "$BASE_REF" --head "$HEAD_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
