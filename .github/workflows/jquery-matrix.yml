name: jQuery version matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  browser:
    name: browser (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: '1.8.3', jquery: 'vendor/jquery-1.8.3.js', slim: '0' }
          - { id: '1.9.1', jquery: 'vendor/jquery-1.9.1.js', slim: '0' }
          - { id: '1.10.2', jquery: 'vendor/jquery-1.10.2.js', slim: '0' }
          - { id: '1.11.3', jquery: 'jquery-1.11.3', slim: '0' }
          - { id: '1.12.4', jquery: 'jquery-1.12.4', slim: '0' }
          - { id: '2.0.3', jquery: 'vendor/jquery-2.0.3.js', slim: '0' }
          - { id: '2.1.4', jquery: 'jquery-2.1.4', slim: '0' }
          - { id: '2.2.4', jquery: 'jquery-2.2.4', slim: '0' }
          - { id: '3.0.0', jquery: 'jquery-3.0.0', slim: '0' }
          - { id: '3.1.1', jquery: 'jquery-3.1.1', slim: '0' }
          - { id: '3.2.1', jquery: 'jquery-3.2.1', slim: '0' }
          - { id: '3.3.1', jquery: 'jquery-3.3.1', slim: '0' }
          - { id: '3.4.1', jquery: 'jquery-3.4.1', slim: '0' }
          - { id: '3.5.1', jquery: 'jquery-3.5.1', slim: '0' }
          - { id: '3.6.4', jquery: 'jquery-3.6.4', slim: '0' }
          - { id: '3.7.1', jquery: 'jquery-3.7.1', slim: '0' }
          - { id: '3.7.1-slim', jquery: 'jquery-3.7.1', slim: '1' }
          - { id: '4.0.0', jquery: 'jquery-4.0.0', slim: '0' }
          - { id: '4.0.0-slim', jquery: 'jquery-4.0.0', slim: '1' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: pw
        run: echo "version=$(node -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps
      - run: npx playwright test ${{ matrix.projects }}
        env:
          IRS_JQUERY: ${{ matrix.jquery }}
          IRS_SLIM: ${{ matrix.slim }}
          IRS_MIN: ${{ matrix.min || '0' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ matrix.id }}
          path: playwright-report
