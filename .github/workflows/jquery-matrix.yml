name: jQuery version matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  # Same setup as the browser job of ci.yml (issue #944): every cell runs inside Playwright's
  # Docker image for the exact @playwright/test version in package-lock.json, on Ubuntu 24.04
  # (-noble), as uid 1001, with no browser cache. See the comment there for why.
  playwright-image:
    name: playwright image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: lock
        run: node scripts/playwright-version.mjs >> "$GITHUB_OUTPUT"

  browser:
    name: browser (${{ matrix.id }})
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-image.outputs.version }}-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        # Every cell runs the full engine suite plus the #877 combination matrix
        # (--project=matrix), so the weekly run covers the matrix on every jQuery build.
        include:
          - { id: '1.8.3', jquery: 'vendor/jquery-1.8.3.js', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '1.9.1', jquery: 'vendor/jquery-1.9.1.js', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '1.10.2', jquery: 'vendor/jquery-1.10.2.js', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '1.11.3', jquery: 'jquery-1.11.3', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '1.12.4', jquery: 'jquery-1.12.4', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '2.0.3', jquery: 'vendor/jquery-2.0.3.js', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '2.1.4', jquery: 'jquery-2.1.4', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '2.2.4', jquery: 'jquery-2.2.4', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '3.0.0', jquery: 'jquery-3.0.0', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '3.1.1', jquery: 'jquery-3.1.1', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '3.2.1', jquery: 'jquery-3.2.1', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '3.3.1', jquery: 'jquery-3.3.1', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '3.4.1', jquery: 'jquery-3.4.1', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '3.5.1', jquery: 'jquery-3.5.1', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '3.6.4', jquery: 'jquery-3.6.4', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '3.7.1', jquery: 'jquery-3.7.1', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '3.7.1-slim', jquery: 'jquery-3.7.1', slim: '1', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '4.0.0', jquery: 'jquery-4.0.0', slim: '0', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
          - { id: '4.0.0-slim', jquery: 'jquery-4.0.0', slim: '1', projects: '--project=chromium --project=firefox --project=webkit --project=matrix' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test ${{ matrix.projects }}
        env:
          IRS_JQUERY: ${{ matrix.jquery }}
          IRS_SLIM: ${{ matrix.slim }}
          IRS_MIN: ${{ matrix.min || '0' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ matrix.id }}
          path: playwright-report
